name: Atualizacao Diaria de Noticias

on:
  schedule:
    # Roda todo dia as 09:00 UTC (06:00 no horario de Brasilia)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo site do GitHub

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install requests

      - name: Coletar noticias das ultimas 24h
        run: python coletor_noticias.py --atualizar

      - name: Agrupar acontecimentos
        run: python agrupar_noticias.py

      - name: Classificar com o Gemini e sincronizar com Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python classificar_noticias.py --engine gemini
